<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - TRAFFIC</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="apple-touch-icon" href="../images/logo.png">
  <meta name="description" content="Contact TRAFFIC for bookings, collaborations, or general band inquiries.">
  <meta name="theme-color" content="#0a0909">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="contact">

  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <header></header>

  <main>
    <section class="section contact-section">
      <div class="container">
        <div class="glass-panel" style="max-width: 720px; margin: 0 auto;">
          <h2 class="section-title">Contact</h2>
          <!-- 1. Removed action so the browser doesn't force a page reload -->
<form id="myContactForm" method="POST" class="contact-form">
    <input type="hidden" name="apiKey" value="sf_d230b07dd8b588a4a8a6fda8">
    <input type="hidden" name="subject" value="TRAFFIC Contact Form">
    <input type="text" name="honeypot" style="display:none">

    <label>Name
      <input type="text" name="name" placeholder="Your name" required />
    </label>

    <label>Email
      <input type="email" name="email" placeholder="you@example.com" required />
    </label>

    <label>Message
      <textarea name="message" placeholder="Write your message here..." required></textarea>
    </label>

    <button type="submit" class="btn btn-primary">Send Message</button>
</form>

<!-- 2. Tiny script to handle submission and bypass server-side redirect restrictions -->
<script>
document.getElementById('myContactForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Stop standard form action
    
    const formData = new FormData(this);
    
    fetch('https://api.staticforms.dev/submit', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            // Force the browser to go to your success page manually
            window.location.href = "https://traffictheband.github.io/contact/success.html";
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert("Submission failed. Please check your connection.");
    });
});
</script>

        </div>
      </div>
    </section>
  </main>

  <footer></footer>
  <script src="../js/components.js"></script>
</body>
</html>
