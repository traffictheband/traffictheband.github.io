<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - TRAFFIC</title>
  <link rel="icon" type="image/png" href="../images/logo.png">
  <meta name="description" content="View stage and rehearsal gallery captures of Traffic, the Bengal-based rock/blues/alternative band.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="gallery">

  <!-- Ambient Glow Orbs -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <!-- Header -->
  <header>
    <div class="container nav-container">
      <a href="../" class="logo-link">
        <img src="../images/logo.png" alt="Traffic Logo" class="logo-img">
        <div class="logo-text">TRAF<span>F</span>IC</div>
      </a>
      <button class="menu-toggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav>
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../#about">About</a></li>
          <li><a href="../#members">Members</a></li>
          <li><a href="./" class="active">Gallery</a></li>
          <li><a href="../#socials">Socials</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Gallery Section -->
  <main class="container" style="padding-top: 50px; padding-bottom: 80px;">
    <div class="section-header animate-on-scroll">
      <span class="section-tag">[ 03 // VISUALS ]</span>
      <h1 class="section-title">The <span>Gallery</span></h1>
    </div>

    <!-- The container for dynamic gallery logic -->
    <div id="gallery-container" class="gallery-grid animate-on-scroll delay-1">
      <img src="../images/gallery/live-1.jpg" alt="Live Gig Stage">
      <img src="../images/gallery/rehearsal-1.jpg" alt="Rehearsal Raw Room">
      <img src="../images/gallery/live-2.jpg" alt="Live Set Performance">
      <img src="../images/gallery/rehearsal-2.jpg" alt="Jam Session Vibes">
      <img src="../images/gallery/band-1.jpg" alt="Band Portrait Collision">
      <img src="../images/gallery/band-2.jpg" alt="Band Silhouette Noise">
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <span class="lightbox-prev">&#10094;</span>
    <span class="lightbox-next">&#10095;</span>
    <img class="lightbox-content" id="lightbox-img" alt="">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container" style="text-align: center; font-size: 0.8rem; color: var(--text-muted);">
      <p>TRAFFIC - The Band // Visual Showcase</p>
      <p style="margin-top: 5px;"><a href="../" style="color: var(--accent-amber); text-decoration: none;">&lt;- Back to home directory</a></p>
    </div>
  </footer>

  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
